<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Dictionary - Interactive Catalog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-primary: #ffffff;
            --bg-secondary: #f3f4f6;
            --bg-tertiary: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border: #d1d5db;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Main App */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-primary);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
        }

        .sidebar-header {
            margin-bottom: 2rem;
        }

        .sidebar-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-top: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-user:hover {
            background: var(--bg-tertiary);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .user-info h3 {
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
        }

        .user-info h3:hover {
            color: var(--primary);
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: capitalize;
        }

        .sidebar-nav {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 0.5rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-link:hover,
        .nav-link.active {
            background: var(--bg-secondary);
            color: var(--primary);
        }

        .nav-icon {
            font-size: 1.25rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header-title {
            font-size: 1.875rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-logout {
            background: var(--danger);
            color: white;
        }

        .btn-logout:hover {
            background: #dc2626;
        }

        .btn-export {
            background: var(--secondary);
            color: white;
        }

        .btn-export:hover {
            background: #059669;
        }

        /* Search Bar */
        .search-container {
            background: var(--bg-primary);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1.125rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.25rem;
        }

        .search-filters {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-primary);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* Results */
        .results-container {
            background: var(--bg-primary);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .results-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }

        .result-item {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-item:hover {
            background: var(--bg-secondary);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-type {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--primary);
            color: white;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .result-type.column {
            background: var(--secondary);
        }

        .result-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .result-path {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
        }

        .result-description {
            margin-top: 0.5rem;
            color: var(--text-secondary);
        }

        /* Table Details Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .table-info {
            margin-bottom: 2rem;
        }

        .info-row {
            display: flex;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .info-label {
            width: 150px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .info-value {
            flex: 1;
        }

        .columns-table {
            width: 100%;
            border-collapse: collapse;
        }

        .columns-table th {
            text-align: left;
            padding: 0.75rem;
            background: var(--bg-secondary);
            font-weight: 600;
            border-bottom: 2px solid var(--border);
        }

        .columns-table td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-primary {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">📚 Data Dictionary</div>
                <div class="sidebar-user" onclick="window.location.href='/profile'">
                    <div class="user-avatar" id="userAvatar">A</div>
                    <div class="user-info">
                        <h3 id="userName">Admin</h3>
                        <div class="user-role" id="userRole">admin</div>
                    </div>
                </div>
            </div>
            
            <nav>
                <ul class="sidebar-nav" id="sidebarNav">
                    <li class="nav-item">
                        <a href="#" class="nav-link active" data-view="search">
                            <span class="nav-icon">🔍</span>
                            Search
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-view="browse">
                            <span class="nav-icon">📂</span>
                            Browse
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-view="stats">
                            <span class="nav-icon">📊</span>
                            Statistics
                        </a>
                    </li>
                    <!-- Admin button will be added here dynamically -->
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1 class="header-title">Data Catalog</h1>
                <div class="header-actions">
                    <!-- Export button (shows if user has permission) -->
                    <button class="btn btn-export" id="exportBtn" style="display: none;">
                        📄 Export PDF
                    </button>
                    <button class="btn btn-logout" id="logoutBtn">Logout</button>
                </div>
            </header>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-value" id="statSchemas">0</div>
                    <div class="stat-label">Databases</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statTables">0</div>
                    <div class="stat-label">Tables</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statColumns">0</div>
                    <div class="stat-label">Columns</div>
                </div>
            </div>

            <!-- Search -->
            <div class="search-container">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput"
                        placeholder="Search tables, columns, schemas..."
                    >
                </div>
                <div class="search-filters">
                    <select class="filter-select" id="schemaFilter">
                        <option value="">All Schemas</option>
                    </select>
                    <select class="filter-select" id="tableTypeFilter">
                        <option value="">All Types</option>
                        <option value="BASE TABLE">Tables</option>
                        <option value="VIEW">Views</option>
                    </select>
                </div>
            </div>

            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 1rem;">Searching...</p>
            </div>

            <!-- Results -->
            <div class="results-container" id="resultsContainer" style="display: none;">
                <div class="results-header">
                    <span id="resultsCount">0 results</span>
                </div>
                <div id="resultsBody"></div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">🔍</div>
                <h2>Start Searching</h2>
                <p>Search for tables, columns, or schemas to explore your data dictionary</p>
            </div>
        </main>
    </div>

    <!-- Table Details Modal -->
    <div class="modal" id="tableModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Table Details</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Global state
        let currentUser = null;
        const API_URL = '';

        // Check authentication on page load
        window.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(sessionStorage.getItem('user') || '{}');
            
            // Redirect to signin if not logged in
            if (!user.username) {
                window.location.href = '/signin';
                return;
            }

            currentUser = user;
            initializeApp();
        });

        // Initialize app
        function initializeApp() {
            // Update user info in sidebar
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userRole').textContent = currentUser.role;
            document.getElementById('userAvatar').textContent = currentUser.username[0].toUpperCase();

            // Show admin button if user is admin
            if (currentUser.role === 'admin') {
                const adminLink = document.createElement('li');
                adminLink.className = 'nav-item';
                adminLink.innerHTML = `
                    <a href="/admin" class="nav-link">
                        <span class="nav-icon">⚙️</span>
                        Admin Panel
                    </a>
                `;
                document.getElementById('sidebarNav').appendChild(adminLink);

                // Also add groups link for admin
                const groupsLink = document.createElement('li');
                groupsLink.className = 'nav-item';
                groupsLink.innerHTML = `
                    <a href="/groups" class="nav-link">
                        <span class="nav-icon">👥</span>
                        Groups
                    </a>
                `;
                document.getElementById('sidebarNav').appendChild(groupsLink);
            }

            // Show export button if user has permission
            if (currentUser.can_export || currentUser.role === 'admin') {
                document.getElementById('exportBtn').style.display = 'inline-block';
            }

            // Load initial data
            loadStats();
        }

        // API call utility
        async function apiCall(endpoint, options = {}) {
            const response = await fetch(API_URL + endpoint, options);
            
            if (response.status === 401) {
                sessionStorage.clear();
                window.location.href = '/signin';
                return null;
            }
            
            return response.json();
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await apiCall('/api/auth/logout', { method: 'POST' });
            } catch (error) {
                console.error('Logout error:', error);
            }
            
            sessionStorage.clear();
            window.location.href = '/signin';
        });

        // Export PDF
        document.getElementById('exportBtn').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_URL}/api/export/pdf`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'full' })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `data_dictionary_${Date.now()}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                } else {
                    alert('Export failed. Please check your permissions.');
                }
            } catch (error) {
                console.error('Export error:', error);
                alert('Export failed. Please try again.');
            }
        });

        // Load stats
        async function loadStats() {
            const data = await apiCall('/api/stats');
            if (data) {
                document.getElementById('statSchemas').textContent = data.schemas;
                document.getElementById('statTables').textContent = data.tables;
                document.getElementById('statColumns').textContent = data.columns;
            }

            // Load schema filter options
            const schemasData = await apiCall('/api/schemas');
            if (schemasData) {
                const select = document.getElementById('schemaFilter');
                schemasData.schemas.forEach(schema => {
                    const option = document.createElement('option');
                    option.value = schema.name;
                    option.textContent = `${schema.name} (${schema.table_count} tables)`;
                    select.appendChild(option);
                });
            }
        }

        // Search with debounce
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                showEmptyState();
                return;
            }

            searchTimeout = setTimeout(() => performSearch(query), 300);
        });

        // Filter change handlers
        document.getElementById('schemaFilter').addEventListener('change', () => {
            const query = document.getElementById('searchInput').value.trim();
            if (query.length >= 2) {
                performSearch(query);
            }
        });

        document.getElementById('tableTypeFilter').addEventListener('change', () => {
            const query = document.getElementById('searchInput').value.trim();
            if (query.length >= 2) {
                performSearch(query);
            }
        });

        // Perform search
        async function performSearch(query) {
            document.getElementById('loading').classList.add('active');
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';

            const schema = document.getElementById('schemaFilter').value;
            const tableType = document.getElementById('tableTypeFilter').value;

            let url = `/api/search?q=${encodeURIComponent(query)}`;
            if (schema) url += `&schema=${schema}`;
            if (tableType) url += `&table_type=${tableType}`;

            const data = await apiCall(url);
            
            document.getElementById('loading').classList.remove('active');

            if (data && data.results) {
                displayResults(data.results);
            }
        }

        // Display results
        function displayResults(results) {
            const container = document.getElementById('resultsContainer');
            const body = document.getElementById('resultsBody');
            const count = document.getElementById('resultsCount');

            if (results.length === 0) {
                showEmptyState();
                return;
            }

            count.textContent = `${results.length} result${results.length !== 1 ? 's' : ''}`;
            body.innerHTML = '';

            results.forEach(result => {
                const item = document.createElement('div');
                item.className = 'result-item';
                
                if (result.type === 'table') {
                    item.innerHTML = `
                        <span class="result-type">table</span>
                        <div class="result-title">${result.table}</div>
                        <div class="result-path">${result.schema}.${result.table}</div>
                        ${result.description ? `<div class="result-description">${result.description}</div>` : ''}
                        <div style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--text-secondary);">
                            ${result.column_count} columns • ${result.meta.row_count || 0} rows
                        </div>
                    `;
                    item.addEventListener('click', () => showTableDetails(result.schema, result.table));
                } else {
                    item.innerHTML = `
                        <span class="result-type column">column</span>
                        <div class="result-title">${result.column}</div>
                        <div class="result-path">${result.schema}.${result.table}.${result.column}</div>
                        <div style="margin-top: 0.5rem;">
                            <span class="badge badge-primary">${result.data_type}</span>
                        </div>
                        ${result.description ? `<div class="result-description">${result.description}</div>` : ''}
                    `;
                    item.addEventListener('click', () => showTableDetails(result.schema, result.table));
                }

                body.appendChild(item);
            });

            container.style.display = 'block';
        }

        // Show empty state
        function showEmptyState() {
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        }

        // Show table details
        async function showTableDetails(schema, table) {
            const data = await apiCall(`/api/schemas/${schema}/tables/${table}`);
            
            if (!data) return;

            const modal = document.getElementById('tableModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.textContent = `${schema}.${table}`;

            body.innerHTML = `
                <div class="table-info">
                    <div class="info-row">
                        <div class="info-label">Schema</div>
                        <div class="info-value">${data.schema}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Table Name</div>
                        <div class="info-value">${data.table}</div>
                    </div>
                    ${data.description ? `
                    <div class="info-row">
                        <div class="info-label">Description</div>
                        <div class="info-value">${data.description}</div>
                    </div>
                    ` : ''}
                    <div class="info-row">
                        <div class="info-label">Rows</div>
                        <div class="info-value">${data.meta.row_count || 'Unknown'}</div>
                    </div>
                </div>

                <h3 style="margin-bottom: 1rem;">Columns (${data.columns.length})</h3>
                <table class="columns-table">
                    <thead>
                        <tr>
                            <th>Column</th>
                            <th>Type</th>
                            <th>Nullable</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.columns.map(col => `
                            <tr>
                                <td>
                                    <strong>${col.name}</strong>
                                    ${col.meta?.is_primary_key ? '<span class="badge badge-warning">PK</span>' : ''}
                                    ${col.meta?.is_foreign_key ? '<span class="badge badge-success">FK</span>' : ''}
                                </td>
                                <td><code>${col.data_type}</code></td>
                                <td>${col.meta?.is_nullable !== false ? 'Yes' : 'No'}</td>
                                <td>${col.description || '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            modal.classList.add('active');
        }

        // Close modal
        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('tableModal').classList.remove('active');
        });

        // Click outside modal to close
        document.getElementById('tableModal').addEventListener('click', (e) => {
            if (e.target.id === 'tableModal') {
                document.getElementById('tableModal').classList.remove('active');
            }
        });
    </script>

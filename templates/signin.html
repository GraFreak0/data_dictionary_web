<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – Data Dictionary</title>
  <link rel="stylesheet" href="/static/styles/main.css">
  <script>(function(){const t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">📚</div>
      <h1>Data Dictionary</h1>
      <p>Sign in to your account</p>
    </div>

    <div id="globalAlert" class="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" required autocomplete="username" placeholder="Enter your username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" required autocomplete="current-password" placeholder="Enter your password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-bottom:.75rem">Sign In</button>
    </form>

    <div class="auth-divider">or</div>
    <button class="btn btn-purple btn-full" onclick="adminLogin()">🔐 Sign In as Admin</button>

    <div class="auth-footer">
      Don't have an account? <a href="/signup">Create one</a>
      <p style="margin-top:1.5rem;font-size:.75rem;color:var(--text-muted)">Default: <strong>admin</strong> / <strong>admin123</strong></p>
    </div>
  </div>
</div>

<script src="/static/scripts/app.js"></script>
<script>
  let _wantsAdmin = false;

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    await doLogin(_wantsAdmin);
    _wantsAdmin = false;
  });

  function adminLogin() {
    _wantsAdmin = true;
    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
  }

  async function doLogin(toAdmin) {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showAlert('Please enter your username and password.', 'error'); return; }
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const d = await r.json();
      if (d && d.success) {
        sessionStorage.setItem('user', JSON.stringify(d.user));
        sessionStorage.setItem('token', d.token);
        if (toAdmin) {
          if (d.user.role === 'admin') { window.location.href = '/admin'; }
          else { showAlert('Admin access required. Use regular Sign In instead.', 'error'); _wantsAdmin = false; }
        } else { window.location.href = '/'; }
      } else { showAlert(d.error || 'Invalid username or password.', 'error'); _wantsAdmin = false; }
    } catch { showAlert('Connection error — please try again.', 'error'); _wantsAdmin = false; }
  }

  document.querySelectorAll('.form-input').forEach(inp =>
    inp.addEventListener('input', () => document.getElementById('globalAlert').classList.remove('show'))
  );
</script>
</body>
</html>

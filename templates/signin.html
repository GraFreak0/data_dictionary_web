<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Data Dictionary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signin-container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #111827;
            text-align: center;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #374151;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.75rem;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1e40af;
        }

        .btn-admin {
            background: #7c3aed;
            color: white;
        }

        .btn-admin:hover {
            background: #6d28d9;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            color: #6b7280;
            font-size: 0.875rem;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #e5e7eb;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .footer-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .helper-text {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="signin-container">
        <div class="logo">
            <div class="logo-icon">📚</div>
            <h1>Data Dictionary</h1>
            <p class="subtitle">Sign in to your account</p>
        </div>

        <div id="signInError" class="alert alert-error"></div>

        <form id="signInForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary">
                Sign In
            </button>

            <div class="divider">or</div>

            <button type="button" class="btn btn-admin" onclick="signInAsAdmin()">
                🔐 Sign In as Admin
            </button>
        </form>

        <div class="footer-links">
            Don't have an account? <a href="/signup">Create one</a>
        </div>

        <p class="helper-text" style="text-align: center; margin-top: 2rem;">
            Default credentials:<br>
            <strong>admin</strong> / <strong>admin123</strong>
        </p>
    </div>

    <script>
        const API_URL = '';
        let isAdminLogin = false;

        // Regular sign in
        document.getElementById('signInForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await performLogin(isAdminLogin);
        });

        // Admin sign in
        function signInAsAdmin() {
            isAdminLogin = true;
            document.getElementById('signInForm').dispatchEvent(new Event('submit'));
        }

        async function performLogin(forceAdmin = false) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data && data.success) {
                    // Store user info
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    sessionStorage.setItem('token', data.token);

                    // Redirect based on role and login type
                    if (forceAdmin) {
                        // Admin login button clicked
                        if (data.user.role === 'admin') {
                            window.location.href = '/admin';
                        } else {
                            showError('Admin access required. Please use regular Sign In.');
                            isAdminLogin = false;
                        }
                    } else {
                        // Regular login - go to main app
                        window.location.href = '/';
                    }
                } else {
                    showError(data.error || 'Login failed');
                    isAdminLogin = false;
                }
            } catch (error) {
                showError('Connection error. Please try again.');
                isAdminLogin = false;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('signInError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';

            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Clear error on input
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('signInError').style.display = 'none';
            });
        });
    </script>
</body>
</html>

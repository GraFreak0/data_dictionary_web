{#
   FOOTER COMPONENT
   Usage:  {% include 'components/footer.html' %}
   Spans from sidebar edge to right of screen (controlled by CSS).
   JS fills in #footerUser after auth loads.
#}
<footer class="app-footer" id="appFooter" role="contentinfo">

  <!-- Left: copyright -->
  <span class="footer-copy">
    &copy; <span id="footerYear"></span> Data Dictionary
  </span>

  <!-- Centre: brand -->
  <span class="footer-brand">📚 Data Dictionary</span>

  <!-- Right: logged-in user + version -->
  <div class="footer-right">
    <span id="footerUser" class="footer-user"></span>
    <span class="footer-version">v2.0</span>
  </div>

</footer>

<script>
  // Fill in current year dynamically
  (function () {
    const el = document.getElementById('footerYear');
    if (el) el.textContent = new Date().getFullYear();
  })();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – Data Dictionary</title>
  <link rel="stylesheet" href="/static/styles/main.css">
  <script>(function(){const t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:460px">
    <div class="auth-logo">
      <div class="auth-logo-icon">📚</div>
      <h1>Create Account</h1>
      <p>Join the Data Dictionary</p>
    </div>

    <div id="globalAlert" class="alert"></div>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="uname">Username</label>
        <input class="form-input" type="text" id="uname" required minlength="3" maxlength="30" autocomplete="username" placeholder="At least 3 characters">
        <div class="form-helper">At least 3 characters, letters and numbers only</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="pw">Password</label>
        <input class="form-input" type="password" id="pw" required minlength="8" autocomplete="new-password" placeholder="Min 8 characters">
        <div class="pw-bar-wrap"><div class="pw-bar" id="pwBar"></div></div>
        <div class="pw-reqs">
          <h4>Password must contain:</h4>
          <ul>
            <li id="req-len">At least 8 characters</li>
            <li id="req-upper">One uppercase letter (A–Z)</li>
            <li id="req-lower">One lowercase letter (a–z)</li>
            <li id="req-num">One number (0–9)</li>
          </ul>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="pw2">Confirm Password</label>
        <input class="form-input" type="password" id="pw2" required autocomplete="new-password" placeholder="Re-enter password">
        <div class="form-helper" id="matchHelper">Must match the password above</div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submitBtn" style="margin-top:.25rem">Create Account</button>
    </form>

    <div class="auth-footer">Already have an account? <a href="/signin">Sign in</a></div>
  </div>
</div>

<script src="/static/scripts/app.js"></script>
<script>
  const pwEl  = document.getElementById('pw');
  const pw2El = document.getElementById('pw2');
  const pwBar = document.getElementById('pwBar');

  pwEl.addEventListener('input',  () => { checkPw(pwEl.value); checkMatch(); });
  pw2El.addEventListener('input', checkMatch);

  function checkPw(p) {
    const r = { len: p.length >= 8, upper: /[A-Z]/.test(p), lower: /[a-z]/.test(p), num: /[0-9]/.test(p) };
    ['len','upper','lower','num'].forEach(k => {
      const el = document.getElementById('req-' + k);
      if (el) el.className = r[k] ? 'ok' : '';
    });
    const n = Object.values(r).filter(Boolean).length;
    pwBar.className = 'pw-bar ' + (n <= 2 ? 'weak' : n === 3 ? 'medium' : 'strong');
    return Object.values(r).every(Boolean);
  }

  function checkMatch() {
    const h = document.getElementById('matchHelper');
    if (!pw2El.value) { pw2El.classList.remove('is-error'); h.className='form-helper'; h.textContent='Must match the password above'; return; }
    if (pwEl.value === pw2El.value) {
      pw2El.classList.remove('is-error'); h.className='form-helper'; h.textContent='✓ Passwords match';
    } else {
      pw2El.classList.add('is-error'); h.className='form-helper is-error'; h.textContent='Passwords do not match';
    }
  }

  document.getElementById('signupForm').addEventListener('submit', async e => {
    e.preventDefault();
    const username = document.getElementById('uname').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = pwEl.value;
    const confirm  = pw2El.value;

    if (username.length < 3)     { showAlert('Username must be at least 3 characters.', 'error'); return; }
    if (!checkPw(password))      { showAlert('Password does not meet all requirements.', 'error'); return; }
    if (password !== confirm)    { showAlert('Passwords do not match.', 'error'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Creating account…';

    try {
      const r = await fetch('/api/auth/signup', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const d = await r.json();
      if (r.ok && d.success) {
        showAlert('Account created! Redirecting to sign in…', 'success');
        document.getElementById('signupForm').reset();
        pwBar.className = 'pw-bar';
        setTimeout(() => window.location.href = '/signin', 2000);
      } else {
        showAlert(d.error || 'Failed to create account.', 'error');
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    } catch {
      showAlert('Connection error — please try again.', 'error');
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });

  document.querySelectorAll('.form-input').forEach(inp =>
    inp.addEventListener('input', () => document.getElementById('globalAlert').classList.remove('show'))
  );
</script>
</body>
</html>
